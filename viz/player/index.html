<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ItaSoRL - Detectable All Along (captions-only cut)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600&family=Hanken+Grotesk:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage">
    <div id="world-card" class="layer">
      <canvas id="world" width="960" height="960"></canvas>
      <div class="pool-chip" id="chip-a"><span class="chip-label"></span><span class="chip-sub"></span></div>
      <div class="pool-chip" id="chip-b"><span class="chip-label"></span><span class="chip-sub"></span></div>
    </div>

    <div id="gauge" class="layer">
      <div id="gauge-head">
        <div id="gauge-label"></div>
        <div id="gauge-source"></div>
      </div>
      <div id="gauge-legend">shown one real world + one fake - how often it picks the fake</div>
      <div id="gauge-row">
        <div id="gauge-track">
          <div id="gauge-fill"></div>
          <div id="gauge-mid"></div>
          <div id="gauge-ref"></div>
          <div id="gauge-ref-label"></div>
        </div>
        <div id="gauge-value">50%</div>
      </div>
      <div id="gauge-scale"><span>0%</span><span id="gauge-mid-label">50% - coin flip</span><span>100% - always right</span></div>
    </div>

    <div id="caption" class="layer">
      <div id="caption-lead">
        <div id="kicker"></div>
        <div id="headline"></div>
      </div>
      <div id="subline"></div>
    </div>

    <div id="endcard" class="layer">
      <div class="glyph blob-glyph"></div>
      <div id="end-headline"></div>
      <div id="end-recap"></div>
      <div id="end-url"></div>
      <div id="end-foot"></div>
    </div>
  </div>

  <!-- Transport bar: browser viewing only. The capture rig hides it via
       window.__seek so it never appears in encoded film frames. -->
  <div id="controls">
    <button id="ctl-play" aria-label="Pause">&#x2016;</button>
    <input id="ctl-scrub" type="range" min="0" max="89999" step="100" value="0" aria-label="Seek">
    <div id="ctl-time">0:00 / 1:30</div>
    <button id="ctl-views">views</button>
  </div>

  <!-- Overlay gallery: the two site films, viewable without leaving the player.
       The four July demo loops that used to sit here were retired on 2026-10-10
       (assets/film/README.md). Hidden by the capture rig alongside the transport bar. -->
  <div id="gallery">
    <div id="gallery-panel">
      <div id="gallery-head">
        <div id="gallery-title">More ways to see it</div>
        <button id="gallery-close" aria-label="Close">&#x2715;</button>
      </div>
      <div id="gallery-grid">
        <figure>
          <video controls playsinline preload="metadata" poster="../../assets/film/detectable-all-along-poster.jpg">
            <source src="../../assets/film/detectable-all-along-web.mp4" type="video/mp4">
          </video>
          <figcaption>Detectable All Along, the voiced cut of this film (August 2026, pre-correction trainer). Its closing reading, that survival made the creature notice, is withdrawn (FINDINGS 17.6). <a href="../../#film" target="_blank">The caveats &#x2192;</a></figcaption>
        </figure>
        <figure>
          <video controls playsinline preload="metadata" poster="../../assets/film/two-minds-poster.jpg">
            <source src="../../assets/film/two-minds-web.mp4" type="video/mp4">
          </video>
          <figcaption>Two Minds, the labeled brain film: same brain, two worlds, one flaw. Pre-correction trainer; names and rings measured, motion illustrative. <a href="brain/?sec=overview" target="_blank">Live renderer &#x2192;</a></figcaption>
        </figure>
      </div>
      <div id="gallery-foot">
        <a href="../../#film">back to the main page &#x2192;</a>
        <a href="../../assets/film/detectable-all-along-web.mp4" download="detectable-all-along.mp4">download the voiced cut (mp4, pre-correction) &#x2193;</a>
      </div>
    </div>
  </div>

  <script src="player.js"></script>
</body>
</html>
