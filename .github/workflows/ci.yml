name: CI

on:
  # Pushes to main only: a PR branch is covered by pull_request, and building it on
  # push as well ran every PR twice. deploy-pages below still runs on a push to main.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Lint & test (Python ${{ matrix.python-version }})
    # A pinned image, so the runner does not move to a new Ubuntu release on its own.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      # Full history: the anonymized review-build tests resolve every commit the
      # archive names, and in CI a shallow clone fails them instead of skipping.
      # reproduce.history_gap() also needs the commits that live only on old
      # remote branches, so do not prune those branches without first checking
      # r.history_gap(r.commit_ids()) in a fresh full clone.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # requirements-dev.txt pulls in requirements.txt and pins ruff (a newer ruff
          # release flags new errors on untouched code), so it is the one install line.
          pip install -r requirements-dev.txt
          # A broken editable install must fail CI: it is the path pyproject promises.
          pip install -e .

      - name: Lint (ruff)
        run: |
          if ls **/*.py >/dev/null 2>&1 || ls *.py >/dev/null 2>&1; then
            # Lint rules are configured in ruff.toml to match the repo's compact
            # style. `ruff format --check` is intentionally NOT run: the project's
            # deliberate one-line/semicolon style is incompatible with ruff's
            # formatter, which offers no opt-out for it.
            ruff check .
          else
            echo "No Python files yet — skipping ruff."
          fi

      - name: Test (pytest)
        run: |
          # Run only if there are tests; an empty suite must not fail CI.
          if git ls-files '*test_*.py' '*_test.py' 'tests/**.py' | grep -q .; then
            # -rs prints every skip reason, so a new skip shows in the log.
            pytest -q -rs
          else
            echo "No tests found yet — skipping pytest."
          fi

  audit:
    name: Stats recheck (published numbers vs committed artifacts)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Check guarded numbers and wording against committed artifacts
        run: python scripts/audit_stats_recheck.py

  deploy-pages:
    # GitHub Pages serves the gh-pages branch, which is a pure mirror of main
    # (no branch-only commits). Keep it in sync automatically so site changes
    # go live on merge instead of waiting for a manual `git push main:gh-pages`.
    name: Publish site (sync gh-pages to main)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [python, audit]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Mirror main onto gh-pages
        run: git push --force origin HEAD:gh-pages
