name: CD (Release)

# Builds distributable artifacts when a version tag is pushed (e.g. v1.2.3).
# Publishing to PyPI is left commented until the project is ready to release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # The tag must name the version in pyproject.toml and CITATION.cff, and
          # CITATION's date-released should be the tagged commit's date.
          tag="${GITHUB_REF_NAME#v}"
          py=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          cff=$(sed -n 's/^version: //p' CITATION.cff | tr -d '"')
          if [ "$tag" != "$py" ] || [ "$tag" != "$cff" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject $py / CITATION $cff"
            exit 1
          fi
          rel=$(sed -n 's/^date-released: //p' CITATION.cff | tr -d '"')
          day=$(git log -1 --format=%cs HEAD)   # the checkout is the tagged commit
          if [ "$rel" != "$day" ]; then
            echo "::warning::CITATION date-released $rel differs from the tagged commit's date $day"
          fi

      - name: Build package
        run: |
          # One test per file: `ls a b c` exits non-zero when any one name is
          # missing, which skipped the build on every tag while the run stayed
          # green. A missing packaging config now fails the run.
          if [ -f pyproject.toml ] || [ -f setup.py ] || [ -f setup.cfg ]; then
            python -m pip install --upgrade pip build
            python -m build
          else
            echo "No packaging config found"
            exit 1
          fi

      - name: Upload artifacts
        if: hashFiles('dist/*') != ''
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*

  # Uncomment when ready to publish releases to PyPI.
  # publish:
  #   needs: build
  #   runs-on: ubuntu-24.04
  #   environment: pypi
  #   permissions:
  #     id-token: write   # trusted publishing
  #   steps:
  #     - uses: actions/download-artifact@v6
  #       with: { name: dist, path: dist }
  #     - uses: pypa/gh-action-pypi-publish@release/v1
