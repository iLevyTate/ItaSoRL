# Keeps the pinned GitHub Actions versions in the workflows current.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"

  - package-ecosystem: "pip"
    directory: "/"
    # These two files record the environments used for published runs.
    # Keep routine version updates on the active requirements.
    exclude-paths:
      - "constraints-cpu-corrected.txt"
      - "constraints-workstation.txt"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
  - package-ecosystem: "npm"
    directory: "/viz/player/capture"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
