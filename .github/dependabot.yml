# Keeps the pinned GitHub Actions versions in the workflows current.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
  - package-ecosystem: "npm"
    directory: "/viz/player/capture"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
