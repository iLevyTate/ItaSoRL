[pytest]
# The library lives in the itasorl/ package at the repo root, so put the root on
# sys.path for `import itasorl.world` etc. from tests/ without an editable install.
pythonpath = .
testpaths = tests
# An unregistered marker is an error, not a warning, so a typo in a marker name fails.
# Register any new custom marker under a `markers =` block here before using it.
addopts = --strict-markers
